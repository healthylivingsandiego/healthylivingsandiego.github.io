name: Update local news

on:
  schedule:
    - cron: "0 14 * * *"   # 6am Pacific (14:00 UTC) daily -- adjust as you like
  workflow_dispatch: {}     # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install feedparser python-dateutil

      - name: Fetch and build news.json
        run: python3 fetch_news.py

      - name: Commit news.json if it changed
        run: |
          git config user.name "news-bot"
          git config user.email "actions@users.noreply.github.com"
          git add news.json
          git diff --staged --quiet || git commit -m "Update news.json"
          git push
